name: Refresh dashboard data

on:
  schedule:
    - cron: "17 2 * * *"   # every day at 02:17 UTC (06:47 Kabul time)
  workflow_dispatch:        # allows a manual "Run workflow" button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Build aggregated summary (raw data stays in memory only)
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
          KOBO_ASSET_UID: ${{ vars.KOBO_ASSET_UID || 'a4Pwb3bVXuNDAub4dRBNia' }}
        run: python aggregate.py
      - name: Commit summary if it changed
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data/summary.json
          git diff --cached --quiet || git commit -m "Refresh dashboard data"
          git push
